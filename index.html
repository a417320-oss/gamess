    <style>
        body { margin: 0; overflow: hidden; background-color: #1e293b; }
        ::-webkit-scrollbar { width: 12px; height: 16px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 8px; margin: 2px; }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 8px; border: 3px solid rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.8); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Global Animation Styles */
        @keyframes bg-pan { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fadeMoveUp { 0% { opacity: 0; transform: translateY(20px) scale(0.9); } 10% { opacity: 1; transform: translateY(0) scale(1); } 80% { opacity: 1; transform: translateY(-10px) scale(1.05); } 100% { opacity: 0; transform: translateY(-30px) scale(1.1); } }
        .animate-bg-pan { background: linear-gradient(-45deg, #0f172a, #1e293b, #312e81, #0f172a); background-size: 400% 400%; animation: bg-pan 20s ease infinite; }
        .bg-tech-pattern { background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.15) 1px, transparent 0); background-size: 40px 40px; }
        .animate-notification { animation: fadeMoveUp 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    </style>
